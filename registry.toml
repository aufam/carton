#:schema ./registry-schema.json

#
# cpx
#
[cpx.package]
name = "cpx"
authors = ["aufam"]
edition = 17
description = "Improve your C++ development experience"
repository = "https://github.com/aufam/cpx"
readme = "README.md"
keywords = [
    "cpp17",
    "defer",
    "glue-code",
    "header-only",
    "reflection",
    "sql-builder",
    "tag-based-reflection",
]

[cpx.lib]
git = "https://github.com/aufam/cpx"
tag = "v{version}"


#
# fmt
#
[fmt.package]
name = "fmt"
authors = ["fmtlib"]
edition = 11
description = "A modern formatting library"
homepage = "https://fmt.dev"
repository = "https://github.com/fmtlib/fmt"
license = "MIT"
license-file = "LICENSE"
readme = "README.md"
keywords = [
    "c-plus-plus",
    "chrono",
    "cpp",
    "cross-platform",
    "floating-point",
    "formatting",
    "multiplatform",
    "output",
    "performance",
    "printf",
    "ranges",
    "unicode",
]

[fmt.lib]
pre = """
if [ ! -f .cache/fmt.cppm ]; then
    mkdir -p .cache
    sed -E '/^[[:space:]]*import std;[[:space:]]*$/d;s/FMT_HAS_INCLUDE\\("format\\.cc"\\)/0/g;s/FMT_HAS_INCLUDE\\("os\\.cc"\\)/0/g' src/fmt.cc > .cache/fmt.cppm
fi
"""
git = "https://github.com/fmtlib/fmt"
tag = "{version}"
src = ["src/format.cc", "src/os.cc"]
mod = [".cache/fmt.cppm"]
flags = ["-DFMT_ATTACH_TO_GLOBAL_MODULE"]


#
# spdlog
#
[spdlog.package]
name = "spdlog"
authors = ["spdlog"]
edition = 11
description = "Fast C++ logging library."
repository = "https://github.com/gabime/spdlog"
license-file = "LICENSE"
readme = "README.md"
keywords = [
    "cpp",
    "cpp11",
    "header-only",
    "logging",
    "spdlog",
]

[spdlog.lib]
git = "https://github.com/gabime/spdlog"
tag = "v{version}"
flags = ["public:-DSPDLOG_COMPILED_LIB"]

[spdlog.dependencies]
fmt = { version = "12.1.0", visibility = "public", optional = true }
fmt-external-flag = { flags = ["public:-DSPDLOG_FMT_EXTERNAL"], optional = true }

[spdlog.features]
fmt = [] # already bundled in spdlog
fmt-external = ["dep:fmt", "dep:fmt-external-flag"]
default = ["fmt"]
nodefault = ["fmt-external"]


