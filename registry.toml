    "-DBENCHMARK_STATIC_DEFINE",
    "-DHAVE_POSIX_REGEX",
    "-DHAVE_PTHREAD_AFFINITY",
    "-DHAVE_STD_REGEX",
    "-DHAVE_STEADY_CLOCK",
    "-DTEST_BENCHMARK_LIBRARY_HAS_NO_ASSERTIONS",
    "-D_FILE_OFFSET_BITS=64",
    "-D_LARGEFILE64_SOURCE",
    "-D_LARGEFILE_SOURCE",
    "-Wall",
    "-Wextra",
    "-Wshadow",
    "-Wfloat-equal",
    "-Wold-style-cast",
    "-Wconversion",
    "-Werror",
    "-pedantic",
    "-pedantic-errors",
    "-fstrict-aliasing",
    "-Wno-deprecated-declarations",
    "-Wno-deprecated",
    "-Wstrict-aliasing",
    "-Wno-unused-variable",
]


