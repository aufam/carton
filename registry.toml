#
# ggml
#
[ggml.package]
name = "ggml"
authors = ["ggml-org"]
edition = 17
description = "Tensor library for machine learning"
repository = "https://github.com/ggml-org/ggml"
license = "MIT"
license-file = "LICENSE"
readme = "README.md"
keywords = [
    "automatic-differentiation",
    "large-language-models",
    "machine-learning",
    "tensor-algebra",
]

[ggml.lib]
git = "https://github.com/ggml-org/ggml"
tag = "v{version}"
src = ["src/*"]
inc = ["public:include", "src"]
flags = [
    "-Wall",
    "-Wextra",
    "-Wpedantic",
    "-Wcast-qual",
    "-Wpointer-arith",
    "-Wstrict-prototypes",
    "-Wmissing-prototypes",
    "-Wmissing-declarations",
    "-Wmissing-noreturn",
    "-Wno-shadow",
    "-Wno-double-promotion",
    "-Wno-format",
    "-Wno-deprecated-declarations",
    "-Wno-unused-variable",
    "-Wno-unused-function",
    "-Werror=implicit-int",
    "-Werror=implicit-function-declaration",
    "-DGGML_BUILD",
    "-DGGML_COMMIT=\\\"{version}\\\"",
    "-DGGML_VERSION=\\\"{version}\\\"",
    "-DGGML_SCHED_MAX_COPIES=4",
    "-D_GNU_SOURCE",
]

[ggml.dependencies]
cpu = {
    src = ["src/ggml-cpu/*", "src/ggml-cpu/arch/{arch.family}/*", "src/ggml-cpu/amx/*"],
    inc = ["src/ggml-cpu"],
    flags = ["-DGGML_USE_CPU"],
    optional = true,
}
blas = {
    src = ["src/ggml-blas/*"],
    flags = ["-DGGML_BLAS_USE_ACCELERATE"],
    link-flags = ["osx:-framework Accelerate", "linux:-lopenblas"],
    optional = true,
}
metal = {
    src = ["src/ggml-metal/*"],
    inc = ["src/ggml-metal"],
    link-flags = ["-DGGML_METAL_EMBED_LIBRARY", "-framework Foundation", "-framework Metal"],
    optional = true,
}

[ggml.features]
default = ["cpu"]


